      - javascript
      - typescript
      - css
      # Database
      - database
      - sql
      - nosql
      - mongodb
      - postgresql
      - redis

  - name: Security
    emoji: "🔒"
    keywords:
      - security
      - vulnerability
      - cve
      - authentication
      - oauth
      - 보안

  - name: Misc
    emoji: "📌"
    keywords: []  # 기본 카테고리 (매칭 안 된 글)
