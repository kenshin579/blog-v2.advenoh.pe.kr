    emoji: "☁️"
    keywords:
      # Cloud
      - aws
      - gcp
      - azure
      - cloud
      - serverless
      - lambda
      - ec2
      - s3
      - 클라우드
      - 서버리스
      # Kubernetes
      - kubernetes
      - k8s
      - helm
      - kubectl
      - container
      - docker
      - pod
      - 쿠버네티스
      - 컨테이너
      - 도커
      # DevOps
      - ci/cd
      - jenkins
      - github actions
      - terraform
      - ansible
      - devops

  - name: AI / ML
    emoji: "🤖"
    keywords:
      - ai
      - ml
      - machine learning
      - deep learning
      - llm
      - gpt
      - openai
      - tensorflow
      - pytorch
      - 인공지능
