[project]
name = "news-generator"
version = "0.1.0"
description = "IT Biweekly News Generator"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.0",
    "pyyaml>=6.0",
    "supabase>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dateutil>=2.8.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["feed", "category", "markdown", "db"]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
