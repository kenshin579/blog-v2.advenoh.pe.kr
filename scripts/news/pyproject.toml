[project]
name = "news-generator"
version = "0.1.0"
description = "IT Biweekly News Generator"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.0",
    "pyyaml>=6.0",
    "supabase>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = ["db_client", "feed_parser", "categorizer", "markdown_generator", "generate_news"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
