[project]
name = "news-generator"
version = "0.1.0"
description = "IT Biweekly News Generator"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.0",
    "pyyaml>=6.0",
    "supabase>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["modules"]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
